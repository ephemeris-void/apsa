# ============================================================
# ZEPHYR PROJECT CONFIGURATION — SAFETY-CRITICAL
# ============================================================
# Board: NUCLEO-H755ZI-Q
# Console: USART3 (PD8/PD9) @ 115200 via ST-LINK VCP
# micro-ROS: USART6 (PC6/PC7) @ 115200 via FTDI
# ============================================================

# SYSTEM
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y

# SCHEDULER
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_NUM_COOP_PRIORITIES=0
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10

# CLOCK
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_CORTEX_M_SYSTICK=y
CONFIG_SYS_CLOCK_EXISTS=y

# MEMORY
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_THREAD_PRIORITY=3

# FPU
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# CACHE
CONFIG_CACHE_MANAGEMENT=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y

# LOGGING — IMMEDIATE, synchronous
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_EARLY_CONSOLE=y

# ASSERT + SAFETY
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# WATCHDOG
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# FLASH
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# GPIO
CONFIG_GPIO=y
CONFIG_GPIO_INIT_PRIORITY=40

# SPI
CONFIG_SPI=y
CONFIG_SPI_INIT_PRIORITY=70

# I2C (BARO + MAG এর জন্য আবশ্যক)
CONFIG_I2C=y

# SENSOR (DPS310 ড্রাইভারের জন্য)
CONFIG_SENSOR=y
CONFIG_DPS310=y

# UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# RTC
CONFIG_RTC=y

# MULTITHREADING
CONFIG_MULTITHREADING=y

# POSIX
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_SEMAPHORES=y

# OPTIMIZATION
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=n

# NETWORKING
CONFIG_NETWORKING=n

# ============================================================
# micro-ROS — 40k+ লাইনেও স্কেলযোগ্য
# ============================================================
CONFIG_MICROROS=y
CONFIG_MICROROS_NODES="2"
CONFIG_MICROROS_PUBLISHERS="20"
CONFIG_MICROROS_SUBSCRIBERS="10"
CONFIG_MICROROS_CLIENTS="2"
CONFIG_MICROROS_SERVERS="2"
CONFIG_MICROROS_RMW_HISTORIC="8"
CONFIG_MICROROS_XRCE_DDS_HISTORIC="4"
CONFIG_MICROROS_XRCE_DDS_MTU="512"